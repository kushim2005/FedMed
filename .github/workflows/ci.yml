name: FedMed CI

on:
  push:
    branches: ["feature/**", "dev", "main"]
  pull_request:
    branches: ["dev", "main"]

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install linting tools only
        run: pip install flake8

      - name: Lint with flake8
        run: |
          flake8 . \
            --max-line-length=100 \
            --exclude=.venv,__pycache__,data/raw,archive,logs,checkpoints,progress \
            --extend-ignore=E402,W503,F401,E501 \
            --statistics

  structure-check:
    name: Project Structure Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check all required files exist
        run: |
          echo "Checking FedMed project structure..."

          files=(
            "model/unet3d.py"
            "train/train_centralized.py"
            "data/preprocess.py"
            "data/dataset.py"
            "eval/metrics.py"
            "server/fl_server.py"
            "client/fl_client.py"
            "demo/week1_demo.py"
            "utils/logger.py"
            "requirements.txt"
            "Dockerfile"
            "docker-compose.yml"
            ".gitignore"
          )

          all_ok=true
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              echo "  FOUND: $f"
            else
              echo "  MISSING: $f"
              all_ok=false
            fi
          done

          if [ "$all_ok" = true ]; then
            echo ""
            echo "All required files present!"
          else
            echo ""
            echo "Some files are missing!"
            exit 1
          fi

      - name: Check no MRI data committed
        run: |
          echo "Checking no MRI/model data in repo..."
          if find . -name "*.nii" -o -name "*.nii.gz" -o -name "*.dcm" | grep -q .; then
            echo "ERROR: MRI data files found in repo!"
            exit 1
          else
            echo "Clean - no MRI data committed"
          fi

          if find . -name "*.pth" -o -name "*.ckpt" | grep -q .; then
            echo "ERROR: Model checkpoint files found in repo!"
            exit 1
          else
            echo "Clean - no model checkpoints committed"
          fi

  syntax-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Check Python syntax (no heavy deps needed)
        run: |
          echo "Checking Python syntax..."
          python_files=(
            "model/unet3d.py"
            "train/train_centralized.py"
            "data/preprocess.py"
            "data/dataset.py"
            "eval/metrics.py"
            "server/fl_server.py"
            "client/fl_client.py"
            "demo/week1_demo.py"
            "utils/logger.py"
          )
          for f in "${python_files[@]}"; do
            python -m py_compile "$f" && echo "  OK: $f" || echo "  SYNTAX ERROR: $f"
          done
          echo "Syntax check complete"
